<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlockFlix Studio — Creator Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { background: #0a0a0a; color: #fff; font-family: 'DM Sans', sans-serif; min-height: 100vh; }
    .logo { font-family: 'Bebas Neue', sans-serif; font-size: 30px; color: #E50914; letter-spacing: 3px; }
    .upload-zone { border: 2px dashed rgba(255,255,255,0.2); transition: all 0.2s ease; }
    .upload-zone:hover, .upload-zone.dragover { border-color: #E50914; background: rgba(229,9,20,0.05); }
    input:focus, textarea:focus { outline: none; border-color: rgba(229,9,20,0.5); box-shadow: 0 0 0 1px rgba(229,9,20,0.5); }
  </style>
</head>
<body class="flex flex-col items-center py-12 px-6">

  <nav class="w-full max-w-3xl flex justify-between items-center mb-12">
    <div class="logo">BLOCKFLIX <span class="text-white opacity-50 text-xl tracking-normal font-sans">STUDIO</span></div>
    <a href="index.html" class="text-sm text-gray-400 hover:text-white transition">← Back to Platform</a>
  </nav>

  <div class="w-full max-w-3xl bg-[#141414] border border-[#222] rounded-2xl p-8 shadow-2xl">
    <h1 class="text-2xl font-bold mb-2">Upload Content</h1>
    <p class="text-gray-400 text-sm mb-8">Your video will be transcoded into adaptive HLS streams via FFmpeg and stored securely on MinIO.</p>

    <div class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-400 mb-1">Video Title</label>
        <input type="text" id="vid-title" placeholder="e.g., The Decentralized Future" class="w-full bg-[#0f0f0f] border border-[#333] rounded-lg px-4 py-3 text-white placeholder-gray-600 transition">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-400 mb-1">Description</label>
        <textarea id="vid-desc" rows="3" placeholder="What is this video about?" class="w-full bg-[#0f0f0f] border border-[#333] rounded-lg px-4 py-3 text-white placeholder-gray-600 transition"></textarea>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-400 mb-1">Video File (MP4)</label>
        <div class="upload-zone rounded-xl p-10 flex flex-col items-center justify-center cursor-pointer" onclick="document.getElementById('file-input').click()">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2" class="mb-3"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <p id="file-name" class="text-gray-300 font-medium">Click to select or drag and drop</p>
          <p class="text-gray-500 text-xs mt-1">MP4, MOV up to 2GB</p>
          <input type="file" id="file-input" accept="video/mp4,video/quicktime" class="hidden" onchange="updateFileName()">
        </div>
      </div>

      <button onclick="uploadVideo()" class="w-full bg-[#E50914] hover:bg-[#ff1a24] text-white font-bold py-4 rounded-lg transition transform active:scale-[0.99] mt-4">
        Upload to Blockflix
      </button>

      <div id="status" class="hidden mt-4 p-4 rounded-lg text-sm font-medium flex items-center gap-3"></div>
    </div>
  </div>

  <script>
    function updateFileName() {
      const file = document.getElementById('file-input').files[0];
      if(file) document.getElementById('file-name').innerHTML = `<span class="text-[#00c878]">✓ ${file.name}</span>`;
    }

    async function uploadVideo() {
      const file = document.getElementById('file-input').files[0];
      const title = document.getElementById('vid-title').value;
      const desc = document.getElementById('vid-desc').value;
      const statusEl = document.getElementById('status');

      if (!file || !title) {
        statusEl.className = "mt-4 p-4 rounded-lg text-sm font-medium bg-red-900/20 text-red-500 border border-red-900/50 flex items-center gap-3";
        statusEl.innerHTML = "⚠ Please provide a title and select a video file.";
        statusEl.classList.remove('hidden');
        return;
      }

      statusEl.className = "mt-4 p-4 rounded-lg text-sm font-medium bg-yellow-900/20 text-yellow-500 border border-yellow-900/50 flex items-center gap-3";
      statusEl.innerHTML = "<span class='animate-spin text-xl'>↻</span> Uploading to FastAPI pipeline...";
      statusEl.classList.remove('hidden');

      const formData = new FormData();
      formData.append("file", file);
      formData.append("title", title);
      formData.append("description", desc);

      try {
        const response = await fetch('http://localhost:8000/upload', {
          method: 'POST',
          body: formData
        });

        if (response.ok) {
          statusEl.className = "mt-4 p-4 rounded-lg text-sm font-medium bg-green-900/20 text-[#00c878] border border-green-900/50 flex items-center gap-3";
          statusEl.innerHTML = "✓ Upload successful! FFmpeg is now generating HLS streams.";
          document.getElementById('file-input').value = '';
          document.getElementById('file-name').innerText = "Click to select or drag and drop";
          document.getElementById('vid-title').value = '';
          document.getElementById('vid-desc').value = '';
        } else {
          throw new Error("Server rejected upload");
        }
      } catch (error) {
        statusEl.className = "mt-4 p-4 rounded-lg text-sm font-medium bg-red-900/20 text-red-500 border border-red-900/50 flex items-center gap-3";
        statusEl.innerHTML = "✕ Error connecting to backend: " + error.message;
      }
    }
  </script>
</body>
</html>
